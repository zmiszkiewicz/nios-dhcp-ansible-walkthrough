[defaults]
# Run from this folder: cd ansible && ansible-playbook playbooks/<name>.yml
inventory = inventory/
filter_plugins = filter_plugins
collections_path = ~/.ansible/collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
# One fork per wake-up server in the lab is plenty. For 188 servers raise this
# (or set it in the job template): forks = 50
forks = 10

[privilege_escalation]
become = False
